{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-black flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md">
    <!-- Glass Card -->
    <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 border border-white/30 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">☕ FlatWhite</h1>
        <h2 class="text-2xl font-bold text-white">Password Reset Complete</h2>
      </div>

      <div class="bg-green-500/20 border border-green-400/40 rounded-lg p-4 mb-6 backdrop-blur-sm">
        <p class="text-green-100 text-center">
          Your password has been successfully reset. You can now log in with your new password.
        </p>
      </div>

      <a href="{% url 'login' %}" class="w-full flex items-center justify-center bg-white hover:bg-gray-100 text-black font-bold py-3 rounded-lg transition transform hover:scale-105 active:scale-95 shadow-lg">
        Go to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
