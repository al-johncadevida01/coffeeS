{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-black flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md">
    <!-- Glass Card -->
    <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 border border-white/30 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">☕ FlatWhite</h1>
        <h2 class="text-2xl font-bold text-white">Check Your Email</h2>
      </div>

      <div class="bg-green-500/20 border border-green-400/40 rounded-lg p-4 mb-6 backdrop-blur-sm">
        <p class="text-green-100 text-center">
          We've sent an email with instructions to reset your password. Please check your inbox.
        </p>
      </div>

      <p class="text-gray-300 text-sm text-center mb-6">
        If you don't see the email, check your spam folder or try again.
      </p>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-white/30"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white/10 text-gray-200">or</span>
        </div>
      </div>

      <!-- Links -->
      <div class="text-center">
        <a href="{% url 'login' %}" class="text-white font-semibold hover:underline">Back to Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
