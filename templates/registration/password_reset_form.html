{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-black flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md">
    <!-- Glass Card -->
    <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 border border-white/30 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">☕ FlatWhite</h1>
        <h2 class="text-2xl font-bold text-white">Reset Password</h2>
        <p class="text-gray-200 text-sm mt-2">Enter your email to receive a reset link</p>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-white text-sm font-semibold mb-2">
            Email Address
          </label>
          <input 
            type="email"
            name="email"
            placeholder="your@email.com"
            class="w-full bg-white/20 border border-white/40 text-white placeholder-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-white backdrop-blur-md transition"
          />
          {% if form.email.errors %}
            <div class="text-red-400 text-sm mt-2">
              {% for error in form.email.errors %}
                <p>{{ error }}</p>
              {% endfor %}
            </div>
          {% endif %}
        </div>

        <button class="w-full bg-white hover:bg-gray-100 text-black font-bold py-3 rounded-lg transition transform hover:scale-105 active:scale-95 shadow-lg mt-6">
          Send Reset Link
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-white/30"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white/10 text-gray-200">or</span>
        </div>
      </div>

      <!-- Links -->
      <div class="text-center space-y-2">
        <p class="text-gray-200 text-sm">
          Remember your password?
          <a href="{% url 'login' %}" class="text-white font-semibold hover:underline">Sign In</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
