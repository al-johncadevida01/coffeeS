{% load static %}

<nav class="{% if request.resolver_match.url_name != 'login' and request.resolver_match.url_name != 'signup' and 'password_reset' not in request.resolver_match.url_name %}fixed top-0 left-0 right-0{% endif %} z-50 bg-white/30 backdrop-blur-2xl border-b border-white/30 shadow-xl">
  <div class="max-w-7xl mx-auto px-6 sm:px-6 py-5 sm:py-4 flex justify-between items-center relative">
    <a href="/" class="flex items-center gap-3">
      <img src="{% static 'logo.png' %}" alt="FlatWhite Logo" class="h-10 sm:h-12 w-auto">
      <span class="text-3xl sm:text-3xl font-bold text-gray-900">FlatWhite</span>
    </a>

    <!-- Hamburger Button (All Screens) -->
    <button id="hamburger" class="flex flex-col justify-center items-center w-12 h-12 sm:w-10 sm:h-10 space-y-2 sm:space-y-1.5 focus:outline-none group" aria-label="Toggle menu">
      <span class="block w-7 sm:w-6 h-0.5 bg-gray-800 transition-all duration-300 ease-in-out group-hover:bg-black"></span>
      <span class="block w-7 sm:w-6 h-0.5 bg-gray-800 transition-all duration-300 ease-in-out group-hover:bg-black"></span>
      <span class="block w-7 sm:w-6 h-0.5 bg-gray-800 transition-all duration-300 ease-in-out group-hover:bg-black"></span>
    </button>

    <!-- Dropdown Menu -->
    <div id="dropdownMenu" class="absolute top-full right-4 sm:right-6 mt-2 w-64 bg-white/40 backdrop-blur-2xl shadow-2xl rounded-xl border border-white/40 overflow-hidden transition-all duration-300 ease-in-out max-h-0 opacity-0">
      <div class="flex flex-col p-4">
        {% if user.is_authenticated %}
          <div class="pb-3 mb-3 border-b border-gray-300/50">
            <p class="text-xs text-gray-600 mb-1">Logged in as</p>
            <p class="text-sm text-gray-900 font-semibold">{{ user.username }}</p>
          </div>
          <form method="post" action="{% url 'logout' %}" class="w-full">
            {% csrf_token %}
            <button type="submit" class="w-full text-center bg-black/90 backdrop-blur-sm text-white px-6 py-3 rounded-lg hover:bg-black transition font-semibold shadow-lg">
              Logout
            </button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="w-full text-center bg-white/60 backdrop-blur-md text-gray-800 border-2 border-white/60 px-6 py-3 rounded-lg hover:bg-white/80 hover:border-white/80 transition font-semibold mb-3">
            Login
          </a>
          <a href="{% url 'signup' %}" class="w-full text-center bg-black/90 backdrop-blur-sm text-white px-6 py-3 rounded-lg hover:bg-black transition font-semibold shadow-lg">
            Sign Up
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<script>
  const hamburger = document.getElementById('hamburger');
  const dropdownMenu = document.getElementById('dropdownMenu');
  let isOpen = false;

  hamburger.addEventListener('click', () => {
    isOpen = !isOpen;
    
    // Hamburger animation
    const spans = hamburger.querySelectorAll('span');
    if (isOpen) {
      spans[0].style.transform = 'rotate(45deg) translateY(8px)';
      spans[1].style.opacity = '0';
      spans[2].style.transform = 'rotate(-45deg) translateY(-8px)';
      
      // Dropdown animation
      dropdownMenu.style.maxHeight = '400px';
      dropdownMenu.style.opacity = '1';
    } else {
      spans[0].style.transform = '';
      spans[1].style.opacity = '';
      spans[2].style.transform = '';
      
      // Dropdown animation
      dropdownMenu.style.maxHeight = '0';
      dropdownMenu.style.opacity = '0';
    }
  });

  // Close menu when clicking outside
  document.addEventListener('click', (e) => {
    if (isOpen && !hamburger.contains(e.target) && !dropdownMenu.contains(e.target)) {
      hamburger.click();
    }
  });
</script>
